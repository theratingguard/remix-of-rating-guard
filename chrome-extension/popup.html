<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rating Guard Submission Assistant</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 16px;
        color: #17212b;
        font:
          14px/1.45 system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        margin: 8px 0;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-weight: 600;
      }
      input,
      select,
      textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
      }
      textarea {
        min-height: 100px;
      }
      button {
        margin: 6px 6px 0 0;
        padding: 8px 10px;
        cursor: pointer;
      }
      #status {
        min-height: 40px;
        color: #115e59;
      }
      .warning {
        padding: 8px;
        border-left: 3px solid #d97706;
        background: #fffbeb;
      }
    </style>
  </head>
  <body>
    <h1>Rating Guard</h1>
    <p class="warning">
      Manual assistant only. It opens the exact Google Maps review; you choose “Report review” and
      submit it yourself.
    </p>
    <label for="token">Short-lived Rating Guard user session token</label>
    <input id="token" type="password" autocomplete="off" />
    <button id="connect" type="button">Connect</button>
    <button id="disconnect" type="button">Disconnect</button>
    <label for="scanId">Scan report ID</label>
    <input id="scanId" inputmode="text" />
    <button id="load" type="button">Load current report</button>
    <label for="review">Supported review</label>
    <select id="review"></select>
    <label for="draft">Verified request draft (not submitted)</label>
    <textarea id="draft" readonly></textarea>
    <button id="open" type="button">Open exact review in Google Maps</button>
    <button id="copy" type="button">Copy draft</button>
    <label for="reference">Google confirmation / case reference (after submitting)</label>
    <input id="reference" type="text" maxlength="2000" />
    <label for="submittedAt">Actual submission date and time</label>
    <input id="submittedAt" type="datetime-local" />
    <label>
      <input id="confirmed" type="checkbox" style="width: auto" />
      I actually submitted this request in Google Maps.
    </label>
    <button id="record" type="button">Record actual submission</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="popup.js"></script>
  </body>
</html>
